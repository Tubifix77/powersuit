[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "suit-sim"
version = "0.1.0"
description = "Powersuit end-to-end integration simulator: virtual CAN buses, fake edge nodes, an SPI-bridge stand-in, and the real cloud_ai_core server in-process"
requires-python = ">=3.12"
dependencies = [
    "powersuit-proto",
    "cloud-ai-core",
    "websockets>=17,<18",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=1.4,<2"]

[tool.setuptools.packages.find]
include = ["suit_sim*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
